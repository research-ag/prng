[package]
name = "prng"
version = "0.3.1"
description = "Statistical pseudo-random number generators"
repository = "https://github.com/research-ag/prng"
keywords = [ "rand", "random", "rng", "sfc", "seiran" ]
license = "Apache-2.0"

[dev-dependencies]
core = "2.6.2"
bench-helper = "0.0.4"
test = "2.1.2"

[requirements]
moc = "1.0.0"

[toolchain]
moc = "2.0.0"
pocket-ic = "15.0.0"
wasm-opt = "133"
wasmtime = "44.0.0"

[optimize]
